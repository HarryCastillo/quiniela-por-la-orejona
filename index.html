<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Amigos — Por la Orejona 2026-2027</title>
<meta name="description" content="Quiniela Amigos, temporada 2026-2027. Muy pronto abrimos inscripciones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0d0d;
    --panel-1: #161616;
    --panel-2: #1a1a1a;
    --panel-3: #2a2a2a;
    --text: #f0f0f0;
    --text-2: #aaa;
    --text-3: #888;
    --text-4: #777;
    --border-1: #444;
    --border-2: #333;
    --green: #00c06b;
    --green-dark: #009952;
    --green-light: #48c78e;
    --gold: #f5c518;
    --bronze: #cd7f32;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(0,192,107,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 64px);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .wrap{
    max-width: 720px;
    width: 100%;
    text-align: center;
    position: relative;
  }

  .handles{
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 18px;
    margin-bottom: 8px;
  }

  .handle{
    width: 34px;
    height: 60px;
    border: 3px solid var(--gold);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    opacity: 0.85;
  }

  .handle.right{ transform: scaleX(-1); }

  @media (prefers-reduced-motion: no-preference){
    .handle{ animation: sway 4.5s ease-in-out infinite; }
    .handle.right{ animation-delay: .3s; animation-name: sway-right; }
    @keyframes sway{
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }
    @keyframes sway-right{
      0%, 100% { transform: scaleX(-1) rotate(-1.5deg); }
      50% { transform: scaleX(-1) rotate(1.5deg); }
    }
  }

  .eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--green);
    margin: 0 0 18px;
  }

  h1{
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(48px, 12vw, 108px);
    line-height: 0.92;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--text);
    text-transform: uppercase;
  }

  h1 .accent{ color: var(--gold); }

  .season{
    font-family: 'Space Mono', monospace;
    font-size: clamp(18px, 4vw, 26px);
    letter-spacing: 0.08em;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    display: inline-block;
    padding: 8px 22px;
    border-radius: 6px;
    margin: 28px 0 34px;
  }

  .season b{ color: var(--green-light); font-weight: 700; }

  p.lead{
    font-size: 18px;
    line-height: 1.6;
    color: var(--text-2);
    max-width: 460px;
    margin: 0 auto 10px;
  }

  p.sub{
    font-size: 14px;
    color: var(--text-4);
    max-width: 460px;
    margin: 18px auto 0;
    line-height: 1.6;
  }

  .status{
    margin-top: 46px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green-light);
    border-top: 1px solid var(--border-2);
    padding-top: 22px;
  }

  .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
  }

  @media (prefers-reduced-motion: no-preference){
    .dot{ animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse{
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
  }

  @media (max-width: 480px){
    .handle{ width: 26px; height: 46px; }
    p.lead{ font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="handles" aria-hidden="true">
      <div class="handle"></div>
      <div class="handle right"></div>
    </div>
    <p class="eyebrow">Quiniela Amigos</p>
    <h1>Por la <span class="accent">Orejona</span></h1>
    <div class="season">Temporada <b>2026&ndash;2027</b></div>
    <p class="lead">Estamos armando la cancha. Muy pronto abrimos inscripciones para pronosticar la fase de liga, playoffs y todo el camino hasta la final.</p>
    <p class="sub">¿Ya jugaste con nosotros el Mundial 2026? Aquí seguimos — mismo grupo, nuevo torneo.</p>
    <div class="status"><span class="dot"></span> En construcción</div>
  </div>
</body>
</html>
